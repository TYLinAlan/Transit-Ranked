  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Dataset",
    "name": "New York City bus streets and corridors ranked by passenger delay",
    "description": "Two layers over the New York bus network: 1,886 streets covering all 1,491 centreline miles that carry bus service, and the 303 chained corridors drawn from them. Each carries passenger-minutes lost, bus-minutes lost, riders carried, bus trips and a weekday time-of-day profile. Derived from 20 days of MTA GTFS-Realtime trip updates weighted by stop-level automated passenger counts.",
    "url": "https://transitranked.com/",
    "temporalCoverage": "2026-06-26/2026-07-15",
    "spatialCoverage": { "@type": "Place", "name": "New York City" },
    "creator": { "@type": "Organization", "name": "Transit Ranked" },
    "isAccessibleForFree": true,
    "variableMeasured": [
      "passenger-minutes lost",
      "bus-minutes lost",
      "riders carried",
      "bus trips",
      "minutes lost per bus"
    ]
  }
  </script>
